<form role="search" class="flex w-full items-center gap-2" (submit)="submit($event)">
  <div class="relative flex-1">
    <svg
      class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-muted"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <input
      #field
      type="search"
      name="query"
      placeholder="Search movies"
      aria-label="Search movies"
      autocomplete="off"
      enterkeyhint="search"
      class="h-10 w-full rounded-lg bg-surface pr-9 pl-9 text-sm placeholder:text-muted focus:ring-2 focus:ring-accent focus:outline-none [&::-webkit-search-cancel-button]:hidden"
      [value]="value()"
      (input)="onInput(field.value)"
    />
    @if (value()) {
      <button
        type="button"
        aria-label="Clear search"
        class="absolute top-1/2 right-2 flex size-6 -translate-y-1/2 items-center justify-center rounded-md text-muted transition hover:bg-surface-2 hover:text-text focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none"
        (click)="clear()"
      >
        ✕
      </button>
    }
  </div>
  <button
    type="submit"
    aria-label="Search"
    class="flex h-10 shrink-0 items-center gap-2 rounded-lg bg-accent px-3 text-sm font-semibold transition hover:bg-accent-hover focus-visible:ring-2 focus-visible:ring-text focus-visible:outline-none sm:px-4"
  >
    <svg
      class="size-4 sm:hidden"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <span class="hidden sm:inline">Search</span>
  </button>
</form>
