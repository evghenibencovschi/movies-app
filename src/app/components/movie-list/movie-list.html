<ul
  class="grid grid-cols-2 gap-x-4 gap-y-6 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"
  [attr.aria-busy]="loading()"
>
  @for (m of movies(); track m.id; let i = $index) {
    <li>
      <app-movie-card [movie]="m" [priority]="i < priorityCards" />
    </li>
  }
  @for (s of skeletons(); track s) {
    <li data-testid="skeleton" class="animate-pulse" aria-hidden="true">
      <div class="aspect-[2/3] rounded-xl bg-surface"></div>
      <!-- Cards show the title below the poster only on touch screens. -->
      <div class="mt-2 hidden h-4 w-3/4 rounded bg-surface-2 touch:block"></div>
    </li>
  }
</ul>
